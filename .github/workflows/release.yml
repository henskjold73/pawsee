name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: darwin-arm64 }
          - { os: macos-15-intel, name: darwin-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:binary
      - name: Smoke test
        shell: bash
        run: |
          bin=dist/pawsee; [ "${{ runner.os }}" = Windows ] && bin=dist/pawsee.exe
          "$bin" --version
          "$bin" --port 4999 --no-open > run.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:4999/ | grep -q pawsee
          curl -fsS http://127.0.0.1:4999/app.js | grep -q EventSource
          kill %1 || true
      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            (cd dist && 7z a ../pawsee-${{ matrix.name }}.zip pawsee.exe)
          else
            tar -czf pawsee-${{ matrix.name }}.tar.gz -C dist pawsee
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pawsee-${{ matrix.name }}
          path: pawsee-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pawsee-*
          merge-multiple: true
          path: out
      - name: Checksums
        run: cd out && sha256sum pawsee-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
