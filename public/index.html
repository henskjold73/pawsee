<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pawsee</title>
<link id="fav" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span class="logo">🐾</span> pawsee <small id="ver" class="ver"></small></h1>
  <nav class="views" aria-label="View"><button type="button" data-view="live" aria-pressed="true">Live</button><button type="button" data-view="recent" aria-pressed="false">Recent</button></nav>
  <button id="snd" class="snd" type="button" aria-pressed="false" title="Sounds are off. Click to play a soft chime when something needs you or work finishes">🔇 Sound off</button>
  <button id="ntf" class="snd" type="button" aria-pressed="false">🖥 Notify off</button>
  <select id="fcs" class="snd pick" aria-label="Face style" hidden></select>
  <span id="eggnote" class="eggnote" hidden></span>
  <span id="updwrap" class="upd" hidden><a id="upd" target="_blank" rel="noopener"></a><button id="updx" type="button" aria-label="Hide this notice" title="Hide until the next release">×</button></span>
  <div id="summary" class="summary"></div>
</header>
<div id="drift" class="drift" role="status" hidden></div>
<div id="demo" class="demo" hidden>🧪 Demo data — these agents are not real. <a href="/">Show live agents</a></div>
<main id="grid" class="grid"></main>
<p id="empty" class="empty" hidden>No agents yet. Start a Copilot CLI session and its paws will show up here.</p>
<section id="history" class="history" hidden></section>
<svg id="boilsvg" width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="brand-defs"></defs>
  <!-- hand-drawn "boiling" line: the outline re-wobbles a few times a second, like cels redrawn by hand -->
  <filter id="boil" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="1"><animate attributeName="seed" values="1;4;7;2;9;5" dur=".7s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
</svg>
<script src="brands.js"></script>
<script src="faces.js"></script>
<script src="faces/cel.js"></script>
<script src="faces/pixel.js"></script>
<script src="faces/robot.js"></script>
<script src="faces/monsters.js"></script>
<script src="faces/cats.js"></script>
<script src="faces/vampires.js"></script>
<script src="faces/halloween.js"></script>
<script src="faces/ghosts.js"></script>
<script src="mood.js"></script>
<script src="meter.js"></script>
<script src="app.js"></script>
<script src="history.js"></script>
<script src="eggs.js"></script>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
